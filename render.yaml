# Render Blueprint – https://render.com/docs/blueprint-spec
# One web service. State (sessions, offers, verifier transactions) is in memory, so keep it at ONE instance.
services:
  - type: web
    name: eu-wallet-rp-playground
    runtime: node
    plan: starter            # always-on: no free-tier sleep during demos
    region: frankfurt        # EU
    numInstances: 1
    # --include=dev: the TypeScript compiler is a devDependency and Render may set NODE_ENV=production during the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- runtime ----
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # PORT is injected by Render (10000); the app reads it.

      # ---- admin console ----
      - key: ADMIN_PASSWORD          # admin user of the issuer portal (user name: admin). Default when unset: Admin123 – change it on a public site.
        sync: false

      # ---- public URL ----
      # Optional. Defaults to RENDER_EXTERNAL_URL (https://<service>.onrender.com). Set it when you add a custom domain.
      # All wallet-facing URLs (request_uri, response_uri, issuer identifier, credential endpoint) are built from it.
      - key: PUBLIC_BASE_URL
        sync: false

      # ---- session ----
      - key: SESSION_SECRET
        generateValue: true          # random, kept by Render

      # ---- demo modes ----
      # false = real EU Wallet only; true adds the simulated wallet (by-value requests then offer the mdoc PID and SD-JWT, a larger QR).
      - key: MOCK_MODE
        value: "false"
      - key: MULTI_CREDENTIAL        # university: true = one PID+BC request, false = two requests in a row
        value: "false"
      - key: UNIVERSITY_REQUIRE_MATCH   # university: true = PID and birth certificate must show the same name + date of birth (default: off)
        value: "false"

      # ---- OpenID4VP verifier ----
      # redirect_uri = unsigned request passed by value: no verifier certificate needed (wallets cannot reject an untrusted one).
      # Switch to x509_hash / x509_san_dns once VERIFIER_SIGNING_KEY_JWK + VERIFIER_CERT_CHAIN_PEM hold a certificate the wallet trusts.
      - key: VP_CLIENT_ID_SCHEME     # redirect_uri | x509_hash (HAIP) | x509_san_dns
        value: redirect_uri
      - key: VP_RESPONSE_MODE        # direct_post.jwt (encrypted, required by HAIP wallets) | direct_post
        value: direct_post.jwt
      - key: VP_QUERY_LANGUAGE       # dcql | pex
        value: dcql
      - key: DIAGNOSTICS_ENDPOINT    # exposes GET /vp/diagnostics: recent protocol events (no claim values / tokens). Disable when done.
        value: "true"
      - key: VP_DEEPLINK_BASE        # wallet invocation scheme
        value: openid4vp://authorize
      # DEMO PLAYGROUND SWITCH: accept credentials from ANY issuer (signature is still checked against the credential's own key /
      # certificate, so a real IN Groupe PID verifies without its CA being configured). A warning chip is shown on the dashboard.
      # Set to "false" and configure TRUSTED_CA_PEM / TRUSTED_ISSUERS for anything stricter.
      - key: TRUST_ANY_ISSUER
        value: "true"
      - key: TRUSTED_ISSUERS         # comma list of credential-issuer URLs to trust for PID, e.g. the IN Groupe Issuer
        sync: false
      - key: TRUSTED_CA_PEM          # PEM trust anchor(s) for credentials carrying an x5c chain (use \n for newlines)
        sync: false
      - key: VP_REGISTRATION_CERT        # registration certificate (JWT, rc-wrp+jwt) shown by the wallet as the RP's name/purpose. Default: config/registration-cert.jwt (test certificate); "none" = off. Signed requests only (x509 scheme)
        sync: false
      - key: VP_REGISTRATION_LINKS    # unsigned links: button (only the Open-in-wallet button carries the certificate; default) | all (no QR code possible) | off
        sync: false
      - key: RP_BANK_REGISTRATION_CERT   # per-RP override (also RP_ESHOP_…, RP_UNIVERSITY_…, RP_ELECTRICITY_…); else VP_REGISTRATION_CERT is used
        sync: false
      - key: VERIFIER_SIGNING_KEY_JWK    # SECRET: private ES256 JWK of the verifier certificate (npm run keygen)
        sync: false
      - key: VERIFIER_CERT_CHAIN_PEM     # certificate chain for that key, SAN dNSName = this host (use \n for newlines)
        sync: false

      # ---- attestation issuer ----
      # external = SIGMA issuer (https://issuer.sigma.prep.smartid.nuagein.io). Attestations it does not offer (bank account, payment)
      # are issued by the local demo issuer instead (ISSUER_FALLBACK_LOCAL). Set to "local" to issue everything locally.
      - key: ISSUER_MODE             # local | external
        value: external
      - key: ISSUER_FALLBACK_LOCAL
        value: "true"
      - key: ISSUER_METADATA_URL     # OID4VCI credential issuer metadata of the external issuer (live credential catalogue)
        value: https://issuer.sigma.prep.smartid.nuagein.io/.well-known/openid-credential-issuer
      - key: ISSUER_TX_CODE          # local issuer: require a 4-digit transaction code
        value: "false"
      - key: ISSUER_SIGNING_KEY_JWK  # SECRET: private ES256 JWK of the local issuer. Without it the key changes at each restart.
        sync: false
      - key: ISSUER_API_BASE_URL     # external issuer base URL (offer API: POST <base>/offer, see src/issuer/external.ts)
        value: https://issuer.sigma.prep.smartid.nuagein.io
      - key: ISSUER_EXTERNAL_OFFER_PATH   # SIGMA offer API: POST /offer
        value: /offer
      - key: ISSUER_EXTERNAL_AUTH    # none | bearer | client_credentials
        value: none
      - key: ISSUER_EXTERNAL_TOKEN_URL
        sync: false
      - key: ISSUER_API_TOKEN        # SECRET
        sync: false
      - key: ISSUER_CLIENT_ID
        sync: false
      - key: ISSUER_CLIENT_SECRET    # SECRET
        sync: false

      # ---- credential configuration ids / vct (override rps.json when the external issuer uses other values) ----
      - key: ATTESTATION_PID_CONFIG_ID
        sync: false
      - key: ATTESTATION_PID_FORMATS      # formats requested for the PID: dc+sd-jwt,mso_mdoc (default both)
        sync: false
      - key: ATTESTATION_PID_ACCEPTED_VCT
        sync: false
      - key: ATTESTATION_ACCOUNT_CONFIG_ID
        sync: false
      - key: ATTESTATION_PAYMENT_CONFIG_ID
        sync: false
      - key: ATTESTATION_BIRTH_CERTIFICATE_CONFIG_ID
        sync: false
      - key: ATTESTATION_BIRTH_CERTIFICATE_ACCEPTED_VCT
        sync: false

      # ---- branding ----
      - key: BRAND_PRIMARY
        sync: false
      - key: BRAND_ACCENT
        sync: false
